# Native RTL-SDR L1 input. Use Query device limits in the GUI for exact tuner gains.
[frontend]
type=rtlsdr
sample_rate_hz=2400000
center_frequency_hz=1575420000
signal_frequency_hz=1575420000
[rtlsdr]
auto_gain=true
gain_tenths_db=0
# E4000 only, manual mode: -1 keeps driver defaults; calibration sets 3..56 dB.
if_gain_db=-1
ppm=0
bias_tee=false
[buffer]
window_samples=2400
ingress_blocks=128
ring_blocks=16
overflow_policy=stop
[receiver]
mode=capture
run_seconds=0
