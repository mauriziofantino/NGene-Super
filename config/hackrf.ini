# Example L1/E1 capture. Select your device/gains; no firmware changes.
[receiver]
mode=capture
# 0 = run until Ctrl+C. Stop is also triggered by input/disk errors.
run_seconds=10
idle_timeout_ms=3000
[frontend]
type=hackrf
# Uncomment when more than one device is connected.
# serial=00000000000000000000000000000000
sample_rate_hz=16000000
center_frequency_hz=1575420000
[hackrf]
# 0 selects the supported filter immediately below the sample rate.
bandwidth_hz=0
lna_gain_db=16
vga_gain_db=20
rf_amp=false
antenna_power=false
[buffer]
window_samples=16000
ingress_blocks=128
ring_blocks=16
overflow_policy=stop
[recording]
enabled=false
prefix=ngene_capture
queue_blocks=128
# Rotate each 16 million complex pairs (one nominal second at this rate).
segment_samples=16000000
