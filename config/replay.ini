# Recorded signed interleaved I/Q: one int8 I followed by one int8 Q per complex pair.
# Set path to a receiver-side existing .cs8 file and rate/RF metadata to its capture settings.
[receiver]
mode=capture
run_seconds=0
idle_timeout_ms=3000
[frontend]
type=file
sample_rate_hz=16000000
center_frequency_hz=1575420000
signal_frequency_hz=1575420000
[replay]
path=
start_sample=0
sample_limit=0
realtime=true
loop=false
[buffer]
window_samples=16000
ingress_blocks=128
ring_blocks=16
overflow_policy=stop
[recording]
enabled=false
point=post
prefix=replay_capture
queue_blocks=128
segment_samples=0
