# Native bladeRF RX0 input; requires a configured vendor FPGA image.
# Query device limits in the GUI for frequency-dependent gain min/max/step.
[frontend]
type=bladerf
sample_rate_hz=16000000
center_frequency_hz=1575420000
signal_frequency_hz=1575420000
[bladerf]
gain_db=30
bias_tee=false
[buffer]
window_samples=16000
ingress_blocks=128
ring_blocks=16
overflow_policy=stop
[receiver]
mode=capture
run_seconds=0
