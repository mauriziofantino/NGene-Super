name: C build and contracts
on: [push, pull_request]
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        web: ["ON", "OFF"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNGENE_WITH_WEB=${{ matrix.web }}
      - run: cmake --build build --config Release --parallel 2
      - run: cmake --build build --config Release --target ngene_int32_fft_lab --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Compare ARM64 int32 FFT with the scalar reference
        if: matrix.os == 'macos-14' && matrix.web == 'OFF' && runner.arch == 'ARM64'
        run: |
          build/ngene_int32_fft_lab build/int32-scalar.bin
          cmake -S . -B build -DNGENE_EXPERIMENTAL_INT32_NEON=ON
          cmake --build build --config Release --target ngene_int32_fft_lab --parallel 2
          build/ngene_int32_fft_lab build/int32-neon.bin
          cmp build/int32-scalar.bin build/int32-neon.bin
  hackrf-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libhackrf-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNGENE_WITH_HACKRF=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  arm64-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
      - run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/linux-aarch64.cmake -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure

      - name: Compare ARM64 int32 FFT under QEMU
        run: |
          cmake --build build --target ngene_int32_fft_lab --parallel 2
          qemu-aarch64 -L /usr/aarch64-linux-gnu build/ngene_int32_fft_lab build/int32-scalar.bin
          cmake -S . -B build -DNGENE_EXPERIMENTAL_INT32_NEON=ON
          cmake --build build --target ngene_int32_fft_lab --parallel 2
          qemu-aarch64 -L /usr/aarch64-linux-gnu build/ngene_int32_fft_lab build/int32-neon.bin
          cmp build/int32-scalar.bin build/int32-neon.bin

  arm32-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user
      - run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/linux-armv7.cmake -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure

  x86-32:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure

  windows-native:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./scripts/verify-windows.ps1 -WorkRoot "$env:RUNNER_TEMP/ngene-msvc-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-msvc-x64-evidence
          path: |
            ${{ runner.temp }}/ngene-msvc-evidence/acceptance.json
            ${{ runner.temp }}/ngene-msvc-evidence/logs/
            ${{ runner.temp }}/ngene-msvc-evidence/checkout/build/**/CMakeCache.txt
            ${{ runner.temp }}/ngene-msvc-evidence/checkout/build/**/CMakeConfigureLog.yaml
            ${{ runner.temp }}/ngene-msvc-evidence/checkout/build/**/LastTest.log
            ${{ runner.temp }}/ngene-msvc-evidence/checkout/build/*/*-junit.xml
            ${{ runner.temp }}/ngene-msvc-evidence/checkout/build/**/vcpkg-manifest-install.log
            ${{ runner.temp }}/ngene-msvc-evidence/*-package/*.zip
  windows-arm64-native:
    runs-on: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./scripts/verify-windows.ps1 -Architecture ARM64 -WorkRoot "$env:RUNNER_TEMP/ngene-msvc-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-msvc-arm64-evidence
          path: |
            ${{ runner.temp }}/ngene-msvc-evidence/acceptance.json
            ${{ runner.temp }}/ngene-msvc-evidence/logs/
            ${{ runner.temp }}/ngene-msvc-evidence/checkout/build/**/CMakeCache.txt
            ${{ runner.temp }}/ngene-msvc-evidence/checkout/build/**/LastTest.log
            ${{ runner.temp }}/ngene-msvc-evidence/checkout/build/*/*-junit.xml
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y doxygen
      - run: cmake -S . -B build -DNGENE_WITH_DOCUMENTATION=ON
      - run: cmake --build build --target ngene_docs
  naming:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy ripgrep libhackrf-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DNGENE_WITH_HACKRF=ON
      - run: cmake --build build --parallel 2
      - run: rg --files src apps tests -g '*.c' -0 | xargs -0 -n 1 clang-tidy -p build --quiet
