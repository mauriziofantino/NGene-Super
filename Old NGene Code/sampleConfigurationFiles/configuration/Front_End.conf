############### Front end configurations, please add other configurations here
#
# Format:
#
#  progressive id number
#  name
#  Sampling frequency [Hz]
#  Intermediate Frequency [Hz]
#  Doppler sign correction (-1/+1)
#  Number of used bit per sample
#  Mean value of the samples
#  USB: VID/PID numbers (put a 0x0000/0x0000 string if unknown)
#		
# P.S. for N_FUELS generated files, FE 3 is used: in this case, frequencies must be 
#      changed accordingly to N-FUELS parameters used for samples generation. Each sample
#      must be represented using 8 bits (schar or int8 type). For N-FUELS FE user must
#      specify the number of the bits out of the ADC, whereas VID/PID information is 
#      not used. 
#
# P.S. if the FE is Custom, N-Fuels or USRP, the conditioning of the signal depends on 
#       the number of used bits and the mean value
#      - if the number of bits is greater than 4, right shifts are performed to reduce dynamic
#      - if the mean value is not 0, the sample is unsigned, so the mean value is subtracted in order
#        to translate it into a signed char (NGene internal format)
#      - if both conditions are met, both unsigned-signed conversion and shift are performed
#
# P.S. sometimes tracking and acquisition do not estimate the real value of Doppler shift, 
#      but the value after a sign change: this is due to the FE characteristics. Use -1 for 
#      "Doppler sign correction" when the Doppler sign is inverted, +1 elsewhere.
#

