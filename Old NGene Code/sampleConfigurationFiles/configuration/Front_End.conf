############################ USB Blocksize
# This is a CRITICAL parameter: a wrong value can result
# in NGene being not able to read samples from USB!
#
# Change only if NGene2 cannot read samples from USB
# e.g. when NGene2 immediately terminates with the error
# ERROR  : libusb error: LIBUSB_TRANSFER_TIMED_OUT
#
# The new value must be a power of two.
# The default value is 8192 ( == 2^13)
#[USB Blocksize]
# 8192
 	
