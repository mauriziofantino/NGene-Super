############################# 
# PVT parameters
############################# 

################## Frequency for pseudorange evaluation (Hz)
[PVT rate]
  1.0

################## Max diluition of precision
[Max GDOP]
  30.0

################## PVT method
# 0 = LMS_BASED_PVT 	
# 1 = KALMAN_BASED_PVT
[PVT method]
  0 

################## Carrier smoothing Filter Length
# 0 = disable Carrier Smoothing
[CSM filter length]
  32
	
################## Use elevation mask
# Note: put 0 if you use Urban Canyon mask
# 0 = Don't use 	
# 1 = Use
[Use elevation mask]
  1

################## Elevation flag mask [degrees] (only if Use elevation mask = 1)
[Elevation mask]
  5.0

################## Use Urban Canyon mask
# 0 = Don't use 	
# 1 = Use
[Use urban canyon mask]
  0 

################## Use EGNOS corrections in PVT
# 0 = Don't use 	
# 1 = Use
[Use EGNOS]
  1 

################# Static Receiver
# This flag is used in some checks during the PVT computation
# 0 = Dynamic scenario (the receiver moves)
# 1 = Static scenario (the receiver is still)
[Static Receiver]
  1 

##################
# Galileo OSNMA
################## Use of not authenticated signals in PVT
# This flag allows the user to set a selection strategy 
# for the PRNs to be used in the PVT computation based on the OSNMA autentication results
# Possible values are
# 0 => Discard not authenticated PRNs
# 1 => Discard PRNs with failed authentications
# 2 => Do not discard on the basis of the OSNMA authentication
[Not Authenticated Sats in PVT]
  2

##################
# Galileo I/NAV 2
################## Use of RedCED in PVT
# This flag configures the use of RedCED in the PVT computation
# It affects only Galileo satellites.
# Possible values are
# 0 => Disable the use of RedCED, only CED are used 
# 1 => Enable the use of RedCED when CED are not available (default)
# 2 => Use RedCED only, i.e. do not use CED
#      (Not recommended, this behaviour should be selected only for debug purposes)
[Enable RedCED in PVT]
  0

