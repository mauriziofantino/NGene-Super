
# In this file configuration parameters related to the 
# parse of the navigation message will be stored 


# GPS Week Number Correction
# This number will be added to the WN parsed from the navigation message broadcast by GPS satellites
# WN in navigation message is modulus 1024
# It should be adapted in case of elaboration of samples stored in files or of a signals generated
# by a HW signal generator.
# Valid values are positive integers, multiple of 1024. Use the following table as reference
#
# value  starting from (dd/mm/yyyy)
# 1024	 22/ 8/1999
# 2048	  7/ 4/2019
# 3072	 21/11/2038
# 4096	  7/ 7/2058
# 5120	 20/ 2/2078
# 6144	  6/10/2097
# 7168	 23/ 5/2117
# 8192	  6/ 1/2137
#
# If the reported value is not valid, a predefined correction embedded in the receiver will be used.

[GPS WN correction]
  2048
	
# The correction for Galileo (WN in Galileo messages is modulus 4096) is automatically
# evaluated from the correction for GPS WN.


# LEAP SECONDS
# The value configured here will be used as default to obtain the UTC time from the GNSS time
# when the conversion parameters are not available.
# Use the following table as reference (Dates older than 2006 are omitted).
#
# Start Date (yyyy-mm-dd)  Leap Seconds
# 2006-01-01               14
# 2009-01-01               15
# 2012-07-01               16
# 2015-07-01               17
# 2017-01-01               18
# ???                      19

[Default Leap Seconds]
  18
     

