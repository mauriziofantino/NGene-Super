############################# Galileo support
# When > 0 NGene2 elaborates all possible Galileo PRNs (e.g. signal from IFEN generator)
# Otherwise, NGene2 elaborates just existing PRNs listed in otherData/Galileo_real_PRNs.txt (e.g. real signal)
[Enable all Galileo PRNs]
 1

############################# Automatic/Manual Configuration
# When 1 NGene2 searches all possible PRNs, when 0 NGene2 searches only PRNs specified in the file PRN_List.conf
[Automatic Configuration]
 1

############################# Receiver clock emulation
# When 1, NGene2 uses the PC/embedded system clock to emulate a hardware receiver clock,
# i.e. at the start of the elaboration the current date and time of the PC are used
# as the current time.
# If the value is different from 1, then the feature is disabled.
# If the elaboration is from file, then the feature is disabled regardless of the value chosen here.
# It is recommended to disable this feature when the elaborated samples come from a signal generator.
[Receiver clock emulation]
 0

# Receiver clock maximum error
# A gross estimate of the maximum error (absolute value) of the PC date/time [s]
[Receiver clock error]
 120
