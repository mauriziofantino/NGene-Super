  2.0
[Galileo DLLgain]		
  1.0
[Galileo FLLbandwidth]		
 15.0
[Galileo FLLgain]		
  1.0
[Galileo PLLbandwidth] 		
 15.0
[Galileo PLLgain] 		
  1.0 		

 
#####################################
# length of the filter used for FLL->PLL transition
[FLLPLLChoiceFilter Length]
  20

#####################################
# the choice between FLL and PLL is made every FLLPLLChoiceFilterUpdateTime ms
[FLLPLLChoiceFilterUpdateTime] 	
  100

#####################################
# PLLFLLthreshold - threshold value used to choose between FLL and PLL
[PLLFLLthreshold]
  1.0

#####################################
# changePeriodCtrlLength, that is the number of valid data transitions before we can change integration period.
# if  0, passes to user integration period at the first transition
# if  1, verifies the 2nd transition vs the 1st one
# if  2, verifies the 2nd transition vs the 1st one, and the 3rd one vs the 2nd one, etc...
[changePeriodCtrlLength]
  5

#####################################
# spacing, that is the distance between early-replica and late-replica of local code.
# It's expressed in terms of chip fraction, so it must be a number included in the range (0:2]
[GPS spacing]
  0.8
[Galileo spacing]
  0.4

#####################################
# spacing, that is the distance between very early-replica and very late-replica of local code.
# It's expressed in terms of chip fraction, so it must be a number included in the range (0:2]
[Very Early Very Late GPS spacing]
  0.36
[Very Early Very Late Galileo spacing]
  0.18


