# This file contains the parameters used to enable and configure the log saved by the receiver
# Custom logs can be analyzed by using the scripts in ~/.ngene2/matlabScripts/

#########################
# GENERAL  CONFIGURATIONS  
#########################

# Path where all the logs are saved.
# If the folder is not specified or if the specified folder does not exist,
# then the current folder is used
# Do not terminate with /
#[Dump Path]
#  .

# Split logs
# For details about split logs read the NGene2 user manual

# Enable split logs
# If this flag is >0, then each log is split into different files (in different folders)
# If this flag is <=0, then each log is saved in a unique file  
[Enable split log]
  0
	
# Split log period, i.e. the maximum duration of a log before it is split (in hours)
# It must be an integer number > 0
[Split log period]
  4

# Split log alignment: 
# if enabled (flag>0) the logs are split aligned to the hour (GNSS time)
[Split log aligned]
  0


#########################
# SPECIFIC CONFIGURATIONS  
#########################

# ACQUISITION
# The Acquisition log save information about the results obtained by the Coarse Acquisition,
# the Doppler Shift Refinement and the Code Delay Refinement.
# Compatible with the scripts: analyzeCaf.m, analyzeDopplerRef.m, analyzeCodeRef.m

# Enable the acquisition log with a value > 0
[Enable Acquisition Log]
  0




# TRACKING
# The tracking log saves the variables internal to the tracking stage.
# Compatible with the scripts: analyzeNGene2Correlators.m, analyzeNGene2MultiCorrelators.m,
# findPrnsInNGene2Correlators.m, findPrnsInNGene2MultiCorrelators.m

# Enable the tracking log with a value > 0
[Enable Tracking Log]
  0




# NAVIGATION MESSAGE
# NGene2 can save a custom verbose log about the content of the navigation message
# received from the satellites. A log of the almanac in YUMA format can be added independently.

# Enable the navigation message log with a value > 0
[Enable Navigation Message Log]
  0

# Enable the navigation message log in IFEN format with a value > 0
[Enable Navigation Message IFEN Log]
  0

# Enable the almanac log in YUMA format with a value > 0
[Enable Almanac Log]
  0




# GALILEO OSNMA
# Several logs can be performed about the Galileo OSNMA parse and validations

# Enable the Galileo OSNMA log with a value > 0
[Enable OSNMA Log]
  0
	
# Enable a simplified log of OSNMA that includes only the authentication flag of the channels in tracking
[Enable OSNMA Simple Log]
  0




# PVT
# Several logs about the inputs and the results of the PVT computation

# Enable the text log with all the PVT data with a value > 0
[Enable PVT Text Log]
  0

# Enable the binary log with all the PVT data with a value > 0
[Enable PVT Binary Log]
  0

# Enable the text log for the GGTO analysis with a value > 0
[Enable GGTO Log]
  0




# RINEX FILES

# Enable the RINEX for navigation message with a value > 0
[Enable RINEX NAV]
  0

# Enable the RINEX for observables with a value > 0
[Enable RINEX OBS]
  0

# The station name must be 4 letters long (max), low case, white spaces not supported
[RINEX Station Name]	
  name

# Name of agency creating the file. Must be 20 letters long (max)
[RINEX Agency Name]
  Agency Name

# Name of antenna marker
[RINEX Marker Name]
  Marker Name

# Type of the Marker, white spaces not supported.
# Must be one of the following strings (white spaces and commas excluded):
# GEODETIC , NON_GEODETIC , NON_PHYSICAL , SPACEBORNE , AIRBORNE , WATER_CRAFT ,
# GROUND_CRAFT , FIXED_BUOY , FLOATING_BUOY , FLOATING_ICE , GLACIER , BALLISTIC ,
# ANIMAL , HUMAN
[RINEX Marker Type]
  NON_GEODETIC

# Name of observer for (OBSERVER / AGENCY entry)
[RINEX Observer]
  Observer Name
# Name of agency for (OBSERVER / AGENCY entry)
[RINEX Agency 2]
  Agency Name

# Receiver Number, string
[RINEX Receiver Number]
  Receiver Number

# Antenna number, string
[RINEX Antenna Number]
  Antenna Number

# Antenna type, string
[RINEX Antenna Type]
  Antenna Type

# Antenna Delta Height/East/North (3 numbers)
# - Antenna height: Height of the antenna reference point (ARP) above the marker |
# - Horizontal eccentricity of ARP relative to the marker (east/north)
# - All units in meters
[RINEX Antenna Delta]
  0.0
  0.0
  0.0




# NMEA FILES
# The description of the NMEA protocol is desumed from an unofficial source
# https://gpsd.gitlab.io/gpsd/NMEA.html

# Enable the NMEA log with a value > 0
[Enable NMEA]
  0

# Name of the file with the NMEA log, white spaces not supported.
# If the string is <auto> (without <>), the name will be automatically chosen by the receiver
[NMEA File Name]
  auto

# TalkerID is a two character string which indicates the type of device.
# It should be GP (GPS receiver), GA (Galileo receiver), GN (GNSS receiver),
# but other strings are accepted
# Alternatively a Proprietary ID can be used, i.e. a 4 four character string
# where the first letter is P.
# The letters should upper-case, white spaces not supported.
[NMEA Talker ID]
  GP

