
#########################################
# General parameters (for NGene2NavMesg)
#########################################


############################# Input files
# Names of the folder and input files.
# The folder is common to all the supported navigation messages.
# A file name is indicated for each of the supported navigation messages.
#
# The file related to the Galileo E1b I/NAV is mandatory 
# (if not specified or not existing, the execution of ngene2NavMesg stops).
# The files related to GPS L1 C/A and Galileo E5a are optional and 
# the user can comment out them using #. 

# Navigation message folder
# indicates the folder where the navigation message files are stored
# Do not terminate with /
[NavMesg folder]
  /complete/path/folder
       
       
# Files
# Mandatory
[NavMesg E1b file]
  filenameINav
	
# Optional, comment out if not needed
[NavMesg L1 CA file]
  filenameL1Ca

[NavMesg E5a file]
  filenameFNav
	
	
############################# Other parameters

# Select input for elaboration
# Set a start time and a end time for the elaboration.
# Inputs out of the specified interval will be discarded.
# Acceptable formats:
# - complete GST time in seconds (e.g. 677806235)
# - GST as WN,TOW (e.g. 1120,430235). TOW in seconds.

# Start time
# Comment out to begin elaboration from the start of the input
#[NavMesg Start Time]
# 677824200
# 1120,448200

# End time
# Comment out to continue elaboration till the end of the input
#[NavMesg End Time]
# 677853000
# 1120,477000


# GPS Parity inversion
# This parameter indicates if the bits of the GPS L1 C/A navigation message 
# are saved before or after the parity inversion
#   0 => bits are saved before the parity inversion
#   1 => bits are saved after the parity inversion
# Critical parameter, a wrong value denies the use of GPS. 
# Some examples
#   IFEN NavX files => use 0
#   Septentrio files => use 1
#   NGene2 files => use 1
[GPS Parity inversion]
  1

# GPS Parity bits inverted
# Set this flag to 1 if the parity inversion affects all the bits in the word
# Set this flag to 0 if the parity inversion affects only the data bits in the word
# If [GPS parity inversion] is 0, this flag is ignored
# Some examples
#   Septentrio files => use 1
#   NGene2 files => use 0
[GPS Parity bits inverted]
  1


# Execution delay [ns] inserted after every second of emulation
# to improve the readablity of the NCurses interface.
# The default value is 1000000 ns.
# Increase it to slow down the execution,
# Decrease it to speed the execution.
[NGene2NavMesg delay]
  1000000







